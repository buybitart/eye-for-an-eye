config_version = 1
[deployment]
profile = "honeypot"
egress = "disabled"
[runtime]
sensor_id = "listener-1"
status_file = "/run/eye-for-an-eye-listener/status.json"
[network]
bind_address = "127.0.0.1"
port = 1234
[deception]
decoy_ports = [1234]
port_profiles = { "1234" = "http" }
source_allowlist = ["127.0.0.0/8", "::1/128"]
[storage]
enabled = true
path = "/var/lib/eye-for-an-eye-listener/events.sqlite3"
[logging]
file = "" # systemd journal owns retention.
[api]
enabled = false
bind_address = "127.0.0.1"
port = 8777
[metrics]
enabled = false
bind_address = "127.0.0.1"
port = 8778
