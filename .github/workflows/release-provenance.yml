name: Release provenance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.14'
      - name: Install uv
        run: python -m pip install uv==0.12.10
      - name: Install build environment
        run: uv sync --frozen --extra capture --extra enrichment --extra test --extra lint --extra quality --extra ml --extra ml-training
      - name: Build release artifacts
        run: uv run --frozen python scripts/build_release.py --output release-artifacts
      - name: List release artifacts
        run: find release-artifacts -maxdepth 2 -type f -print
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release-artifacts/**'
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME >/dev/null 2>&1; then
 echo Release $GITHUB_REF_NAME already exists. Refusing to replace release assets.
 exit 1
 fi
 mapfile -t files < <(find release-artifacts -maxdepth 1 -type f -print | sort)
 test ${#files[@]} -gt 0
 args=(--draft --verify-tag --title $GITHUB_REF_NAME)
 if [[ $GITHUB_REF_NAME == *rc* ]]; then
 args+=(--prerelease)
 fi
 gh release create $GITHUB_REF_NAME ${files[@]} ${args[@]}
