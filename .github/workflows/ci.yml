name: validate
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen --extra capture --extra enrichment --extra test --extra lint --extra quality --extra ml --extra ml-training
      - run: uv run --frozen ruff check eye_for_an_eye tests benchmarks scripts training dataset --no-cache
      - run: uv run --frozen mypy eye_for_an_eye
      # `python -m pytest`, not the `pytest` console script. The two differ in one
      # way that matters here: Python prepends the *script's* directory to
      # sys.path for a script, and the *working* directory for `-m`. A console
      # script lives in the environment's bin/, so under it the repository root is
      # not importable - and this suite imports repository-local top-level modules
      # (`dataset`, `training`, `benchmarks`, and `tests.<module>` for shared
      # fixtures) that only exist there. `eye_for_an_eye` itself is installed by
      # `uv sync`, so the console script failed on exactly the modules that are not
      # packaged, which is why the error list named those four and not the package.
      # Every other step here already uses `python` or `python -m`; this line was
      # the outlier.
      - run: uv run --frozen python -m pytest -q -m "not linux_lab" --junitxml=validation-tests.xml
      - run: uv run --frozen python scripts/security_scan.py
      - run: uv run --frozen pip-audit -r requirements/runtime.txt --disable-pip --no-deps -f json -o dependency-audit.json
      - run: uv run --frozen python scripts/verify_systemd.py
      - run: uv run --frozen python scripts/build_release.py --output release-artifacts
      - run: uv run --frozen python scripts/package_smoke.py release-artifacts/eye_for_an_eye-0.8.0rc2-py3-none-any.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validation-linux-x86_64-python312
          path: |
            validation-tests.xml
            dependency-audit.json
            release-artifacts/
          retention-days: 14
  install-smoke:
    # The documented one-command install must work on a clean checkout, as a
    # normal user, with no root and no firewall change.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Help and dry run change nothing
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/install.sh --help > /dev/null
          sh scripts/install.sh --dry-run --prefix "$HOME/app" --data-dir "$HOME/data"
          test ! -e "$HOME/app"
          test ! -e "$HOME/data"
      - name: One-command install
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/install.sh --prefix "$HOME/app" --data-dir "$HOME/data"
          test -x "$HOME/.local/bin/eye-for-an-eye"
          test -f "$HOME/data/eye-for-an-eye.toml"
          test -f "$HOME/data/events.sqlite3"
      - name: The installed program works, and doctor names exactly the fresh-install gaps
        # `doctor` exits 7 when any component is DEGRADED, and on a fresh install
        # of the safe profile that is the required answer rather than a fault: no
        # calibrator, no access log and no web secret are configured yet, because
        # the installer does not invent deployment-specific artifacts. This step
        # asserted exit 0, which held only while the installed default profile was
        # `website` - a profile with no [autonomy] section, so nothing could be
        # degraded. P18 changed the default to `production-shadow` and this step was
        # not updated with it.
        #
        # The fix asserts the real contract rather than tolerating a non-zero exit:
        # the code must be exactly 7, and the degraded set exactly those three gaps.
        # A regression that degrades anything else - the database, the configuration,
        # the security policy, file permissions - still fails the job, which a
        # `|| true` would have hidden.
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/data"
          eye-for-an-eye --version
          eye-for-an-eye config validate --config eye-for-an-eye.toml
          rendered=0
          eye-for-an-eye doctor --config eye-for-an-eye.toml || rendered=$?
          test "$rendered" -eq 7
          structured=0
          eye-for-an-eye doctor --json --config eye-for-an-eye.toml > doctor.json || structured=$?
          test "$structured" -eq 7
          python - <<'PY'
          import json
          report = json.load(open('doctor.json'))
          degraded = sorted(name for name, part in report.items()
                            if isinstance(part, dict) and part.get('status') == 'DEGRADED')
          assert degraded == ['autonomy', 'web'], degraded
          checks = {name: part['status']
                    for name, part in report['autonomy']['checks'].items()}
          assert [n for n, s in checks.items() if s == 'DEGRADED'] == ['calibrator'], checks
          web = {name: part['status'] for name, part in report['web_detail'].items()
                 if isinstance(part, dict) and 'status' in part and name != 'web'}
          assert [n for n, s in web.items() if s == 'DEGRADED'] == ['secret'], web
          for name in ('configuration', 'database', 'decision_pipeline',
                       'security_policy', 'config_permissions', 'capabilities',
                       'storage_writable', 'disk', 'port_availability'):
              assert report[name]['status'] == 'HEALTHY', (name, report[name])
          print('doctor: exit 7, degraded exactly', degraded,
                '- calibrator, access log and web secret are unset on a fresh install')
          PY
          eye-for-an-eye model status --config eye-for-an-eye.toml
          eye-for-an-eye demo > /dev/null
      - name: Defaults are safe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python scripts/check_safe_defaults.py "$HOME/data/eye-for-an-eye.toml"
      - name: No firewall rule was created
        shell: bash
        run: |
          set -euo pipefail
          sudo nft list ruleset > after.txt 2>/dev/null || true
          ! grep -qi 'eye_for_an_eye\|e4e_' after.txt
      - name: Re-running the installer changes nothing
        shell: bash
        run: |
          set -euo pipefail
          before=$(md5sum "$HOME/data/eye-for-an-eye.toml" | cut -d" " -f1)
          sh scripts/install.sh --prefix "$HOME/app" --data-dir "$HOME/data"
          after=$(md5sum "$HOME/data/eye-for-an-eye.toml" | cut -d" " -f1)
          test "$before" = "$after"
      - name: Uninstall keeps data unless purged
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/uninstall.sh --prefix "$HOME/app" --data-dir "$HOME/data"
          test ! -e "$HOME/app/venv"
          test -f "$HOME/data/eye-for-an-eye.toml"
          sh scripts/uninstall.sh --purge --prefix "$HOME/app" --data-dir "$HOME/data"
          test ! -e "$HOME/data"
  container-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and test internal lab without published ports
        shell: bash
        run: |
          set -euo pipefail
          export E4E_LAB_SECRET="$RUNNER_TEMP/e4e-deception.secret"
          python3 -c 'import os,secrets; fd=os.open(os.environ["E4E_LAB_SECRET"],os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600); os.write(fd,secrets.token_bytes(32)); os.close(fd)'
          sudo chown 10001:10000 "$E4E_LAB_SECRET"
          docker compose -p e4e-ci -f docker-compose.lab.yml config --quiet
          docker compose -p e4e-ci -f docker-compose.lab.yml build
          trap 'docker compose -p e4e-ci -f docker-compose.lab.yml down --volumes' EXIT
          docker compose -p e4e-ci -f docker-compose.lab.yml up -d --wait --wait-timeout 45 honeypot
          docker compose -p e4e-ci -f docker-compose.lab.yml --profile test run --rm client
          docker compose -p e4e-ci -f docker-compose.lab.yml exec -T honeypot eye-for-an-eye storage info --config /etc/eye-for-an-eye/config.toml --json
          docker compose -p e4e-ci -f docker-compose.lab.yml exec -T honeypot python -c 'import os; assert os.geteuid()==10001; assert int(next(x.split()[1] for x in open("/proc/self/status") if x.startswith("CapEff:")),16)==0'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:size=32m eye-for-an-eye:0.8.0-rc.2-lab demo --json
  dataset:
    # Regeneration is not needed on every commit: the normal job already validates the committed
    # dataset, its manifests and its split through the same code paths.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen --extra test --extra capture
      - name: Validate the committed dataset and its manifests
        run: |
          set -euo pipefail
          uv run --frozen python -m dataset manifest --dataset datasets/processed/dataset-v1
          uv run --frozen python -m dataset leakage --dataset datasets/processed/dataset-v1 \
            --output "$RUNNER_TEMP/leakage.json"
          uv run --frozen python -m dataset validate --dataset datasets/processed/dataset-v1
          uv run --frozen python -m dataset review-queue --dataset datasets/processed/dataset-v1 \
            --stats datasets/stats_v1.json
      - name: Rebuild the deterministic sources offline and compare
        run: |
          set -euo pipefail
          uv run --frozen python -m dataset build --lab --pcap --live-runs 0 \
            --output "$RUNNER_TEMP/datasets" --dataset-version dataset-v1-ci
          uv run --frozen python - <<'PY'
          import json, os, pathlib
          fresh = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'datasets', 'manifests',
                                          'dataset-v1-ci.json').read_text())
          committed = json.loads(pathlib.Path('datasets/manifests/dataset-v1.json').read_text())
          # Live loopback traces and the shadow pool are recorded inputs, so a CI rebuild covers
          # the deterministic sources: LAB scenarios and the capture corpus.
          assert fresh['source_type_counts']['LAB'] and fresh['source_type_counts']['PCAP']
          assert fresh['model_feature_names'] == committed['model_feature_names']
          assert fresh['feature_schema_version'] == committed['feature_schema_version']
          print('deterministic sources rebuilt:', fresh['sha256'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dataset-linux-python312
          path: ${{ runner.temp }}/datasets/manifests/
          retention-days: 14
  ml-baseline:
    # Full retraining is not needed on every commit: the normal job already exercises the
    # tiny ONNX fixture and the committed baseline through the production adapter.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen --extra test --extra capture --extra ml --extra ml-training
      - name: Validate the committed dataset
        run: uv run --frozen python -m training.validation --dataset datasets/synthetic-behavior-v3
      - name: Rebuild the dataset offline and compare hashes
        run: |
          uv run --frozen python - <<'PY'
          import json, pathlib, tempfile
          from training.dataset import DATASET_VERSION, write
          committed = json.loads(pathlib.Path('datasets', DATASET_VERSION, 'dataset_manifest.json').read_text())
          with tempfile.TemporaryDirectory() as directory:
              fresh = write(pathlib.Path(directory) / 'rebuild')
          assert fresh['sha256'] == committed['sha256'], 'dataset is not reproducible'
          assert fresh['record_count'] == committed['record_count']
          print('dataset reproducible:', fresh['sha256'])
          PY
      - name: Retrain, replay and evaluate into a scratch directory
        run: |
          set -euo pipefail
          uv run --frozen python -m training.train_logreg \
            --dataset datasets/synthetic-behavior-v3 --output-dir "$RUNNER_TEMP/models"
          uv run --frozen python -m training.shadow_replay \
            --dataset datasets/synthetic-behavior-v3 --model-dir "$RUNNER_TEMP/models" \
            --output "$RUNNER_TEMP/models/risk-logreg-v1-shadow.json"
          uv run --frozen python -m training.evaluate_model \
            --dataset datasets/synthetic-behavior-v3 --model-dir "$RUNNER_TEMP/models" \
            --output "$RUNNER_TEMP/models/risk-logreg-v1-evaluation.json" \
            --report "$RUNNER_TEMP/models/report.md" \
            --shadow "$RUNNER_TEMP/models/risk-logreg-v1-shadow.json" --skip-benchmark
      - name: Replay the labelled lab captures through the retrained candidate
        run: |
          uv run --frozen python -m training.pcap_evaluate --corpus tests/fixtures/p2/corpus.json \
            --model-dir "$RUNNER_TEMP/models" --output "$RUNNER_TEMP/models/risk-logreg-v1-pcap.json"
      - name: Compare the retrained candidate against the committed baseline
        run: |
          uv run --frozen python - <<'PY'
          import json, os, pathlib
          scratch = pathlib.Path(os.environ['RUNNER_TEMP'], 'models')
          fresh = json.loads((scratch / 'risk-logreg-v1.json').read_text())
          committed = json.loads(pathlib.Path('models/risk-logreg-v1.json').read_text())
          assert fresh['onnx_parity']['passed'], fresh['onnx_parity']
          assert fresh['quality_gate_passed'] == committed['quality_gate_passed']
          assert fresh['recommended_mode'] == committed['recommended_mode'] == 'shadow'
          assert fresh['model_feature_names'] == committed['model_feature_names']
          drift = abs(fresh['metrics']['test_pr_auc'] - committed['metrics']['test_pr_auc'])
          assert drift <= 0.02, f'test PR-AUC drifted by {drift}'
          print('retrained candidate matches the committed baseline within tolerance')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ml-baseline-linux-python312
          path: ${{ runner.temp }}/models/
          retention-days: 14
