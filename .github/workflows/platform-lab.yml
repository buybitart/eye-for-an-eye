name: explicit-platform-lab
# Disposable hosted runner only. Never run this job on a production/self-hosted host.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  namespaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen --extra capture --extra test
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2 libpcap0.8
      - name: Only owned isolated namespaces; no host firewall calls
        run: sudo env E4E_RUN_NAMESPACE_LAB=1 "$PWD/.venv/bin/python" -B -m pytest tests/linux_lab -q --junitxml=namespace-tests.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: explicit-namespace-lab
          path: namespace-tests.xml
  systemd-listener:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen
      - name: Install templates only on the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-sysusers deploy/systemd/eye-for-an-eye.conf
          sudo install -d /opt/eye-for-an-eye /etc/eye-for-an-eye
          sudo "$(command -v python)" -m venv /opt/eye-for-an-eye/.venv
          sudo "$(command -v uv)" pip install --python /opt/eye-for-an-eye/.venv/bin/python --no-deps .
          sudo install -m 0640 deploy/listener.toml /etc/eye-for-an-eye/listener.toml
          sudo chown root:10000 /etc/eye-for-an-eye/listener.toml
          sudo /opt/eye-for-an-eye/.venv/bin/python -c 'import os,secrets; fd=os.open("/etc/eye-for-an-eye/deception.secret",os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600); os.write(fd,secrets.token_bytes(32)); os.close(fd)'
          sudo install -m 0644 deploy/systemd/eye-for-an-eye-listener.service /etc/systemd/system/
          sudo systemctl daemon-reload
          trap 'sudo systemctl stop eye-for-an-eye-listener.service' EXIT
          sudo systemctl start eye-for-an-eye-listener.service
          sleep 2
          sudo systemctl is-active --quiet eye-for-an-eye-listener.service
          .venv/bin/python -c 'import socket; s=socket.create_connection(("127.0.0.1",1234),2); s.sendall(b"GET / HTTP/1.0\r\n\r\n"); assert s.recv(1024).startswith(b"HTTP/"); s.close()'
          sudo systemctl restart eye-for-an-eye-listener.service
          sleep 2
          sudo systemctl is-active --quiet eye-for-an-eye-listener.service
          sudo systemctl stop eye-for-an-eye-listener.service
          ! sudo systemctl is-active --quiet eye-for-an-eye-listener.service
