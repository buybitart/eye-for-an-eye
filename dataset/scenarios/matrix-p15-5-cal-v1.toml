# dataset-p15-5-cal-v*: the P15.5 calibration matrix. API-enriched.
#
# WHAT THIS IS FOR. One number: the conservative lower bound on P(malicious) in
# the highest score band. A block requires that bound to clear the cost profile's
# cutoff, the `api` cutoff is 0.987654, and the calibrator fitted in P15.4 tops
# out at 0.981951 — so with that artifact **no autonomous block was possible on
# an API at any score**, not because the evidence was weak but because there was
# not enough calibration data to bound it.
#
# The bound is a Wilson interval over the calibration sample's own examples, so
# its width is set by how many sources land in each band. More independent
# sources is the only honest way to tighten it. Lowering the cutoff is the
# dishonest way and P15.5 §11 forbids it in as many words.
#
# WHY THE MIX CHANGED FROM matrix-p15-4-dev-v1. §12 asks the new calibration
# evidence to represent API behaviour specifically: authenticated batch clients,
# service accounts, high-rate legitimate callers, stale credential clients,
# credential spray, patient account walks, credential automation. Those are the
# families whose probabilities the API cutoff will be applied to, and calibrating
# the API cutoff on a corpus that is mostly web browsing is calibrating for the
# wrong traffic.
#
# So API weight rises from 280 runs to 358, drawn down from the public-website
# benign families, which were the most heavily sampled and the least varied — 62
# runs of "a browser" across three scenarios bought statistical power and no
# coverage.
#
# WHAT DID NOT CHANGE, AND WHY IT MATTERS. Every scanner, probe and composite
# family stays. They are what populate the top score band: the band begins at
# math risk 0.755895, and a credential attack scores 0.75 to 0.78 while a port
# sweep scores 0.83. An API-*only* matrix would add hundreds of positives at 0.75
# and leave the top band exactly as wide as it was, which would have been an
# expensive way to learn nothing. The enrichment is additive, not substitutive.
#
# THE HARD NEGATIVES ARE THE POINT, NOT THE PADDING. §12's last line asks for
# realistic hard negatives and this matrix leans on them: 250 benign API sources,
# including the four families designed to look exactly like the attacks they sit
# beside. `hard-negative/api/stale-credential` is one service account retrying an
# old password for ten minutes — one principal, many failures — and under the
# ungated failure-span term measured in P15.4 it scored 0.784, higher than
# several real attacks. If any of them reaches the top band the bound collapses,
# and that is the test rather than a hazard to be engineered around.
#
# 476 benign and 280 malicious source groups, 756 in total — within the 762
# RFC 5737 documentation addresses the generators may draw from.

matrix_version = "1.0"
dataset_version = "dataset-p15-5-cal-v1"
snapshot_interval_seconds = 2.0
max_samples_per_source = 40
max_samples_per_scenario = 1600


# --- public_website ---------------------------------------------------------
# Drawn down on the benign side, untouched on the malicious side. The scanners
# here are a large share of what fills the top band.

[[scenario]]
id = "benign/web/browse"
group = "benign-web"
generator = "benign.web_client"
runs = 16
params = { requests = 16, period = 1.1, follow_ups = 2 }
site_group = "site-web-1"
profile_type = "public_website"

[[scenario]]
id = "benign/web/browse-slow"
group = "benign-web"
generator = "benign.web_client"
runs = 10
params = { requests = 12, period = 3.4, follow_ups = 1 }
