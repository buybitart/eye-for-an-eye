# dataset-p15-5-locked-v1: the P15.5 locked release benchmark.
#
# Scored exactly once, after the freeze commit, and never used for anything else.
#
# SAME SHAPE, NEW DRAW, NEW UNSEEN PAIR. Every non-withheld scenario below is
# carried over from `matrix-p15-4-locked-v1.toml` unchanged, so the two
# benchmarks are comparable family by family. What differs is the seed salt —
# `p15.5-locked`, which reseeds every scenario and every run — and the withheld
# pair at the end.
#
# THE P15.4 WITHHELD PAIR IS NOT HERE. `withheld.mobile_app_sync` and
# `withheld.probe_then_login` were scored once on the P15.4 benchmark. They are
# still barred from every fitting matrix and always will be, but they are no
# longer *unseen*, and including them here would invite their second score to be
# read as a second independent result. The P15.5 generalisation claim rests on
# the new pair and on nothing else — the same rule P15.4 applied when it
# declined to call the six P15.3 composite families unseen a second time.
#
# THE NEW PAIR, AND WHY THESE TWO. Both sit on `admin`, whose cutoff of 0.888889
# is the lowest of the profiles that may network-block. That makes it
# simultaneously the most demanding test available for a hard negative — the
# place a false block is likeliest — and the fairest one for a positive, where a
# failure to detect is about evidence rather than about an unreachable cutoff.
#
#   withheld.backup_window_sweep   benign. Breadth, volume, regularity and
#                                  persistence at once, from a nightly backup
#                                  agent authenticating successfully on every
#                                  service it protects. The first honest benign
#                                  producer of the (NETWORK_RATE, PORT_BREADTH)
#                                  interaction.
#
#   withheld.credential_drift      malicious. One valid credential, walked
#                                  across services: a success, then breadth,
#                                  then failures from the principal that just
#                                  succeeded. Single-principal on purpose, so
#                                  the strongest authentication signal this
#                                  sensor has is withheld from it and whatever
#                                  the composition makes of it measures the
#                                  port-breadth interaction instead.
#
# 749 runs, within the 762 documentation addresses.

matrix_version = "1.0"
dataset_version = "dataset-p15-5-locked-v1"
snapshot_interval_seconds = 2.0
max_samples_per_source = 40
max_samples_per_scenario = 1600


# --- public_website ---------------------------------------------------------
# Three sites. The profile whose cutoff is 0.975610 and whose traffic is the
# most varied: browsers, crawlers, and whatever the Internet sends at a web
# server unprompted.

[[scenario]]
id = "benign/web/browse"
group = "benign-web"
generator = "benign.web_client"
runs = 26
params = { requests = 16, period = 1.1, follow_ups = 2 }
site_group = "site-web-1"
profile_type = "public_website"

[[scenario]]
id = "benign/web/browse-slow"
group = "benign-web"
generator = "benign.web_client"
runs = 16
params = { requests = 12, period = 3.4, follow_ups = 1 }
