# dataset-generalization-test-v2: the P15.3 locked benchmark.
#
# The twenty-seven families of matrix-eval-v1, trimmed on the plain benign side
# to make room, plus SIX FAMILIES THAT DID NOT EXIST when the MathRisk v2
# weights were chosen. Those six are compositions of primitives the corpus has
# only ever shown separately -- slow pacing with port breadth and address
# breadth; credential shapes spread thin across addresses; decoy contact
# followed by service enumeration -- and three benign controls built from the
# same primitives: sustained volume, address breadth, authenticated bursts.
#
# `dataset/split.py` withholds all six from training entirely, so no feature, no
# weight, no calibrator and no gate was fitted against them. They are what makes
# this a generalisation benchmark rather than another sample of the same corpus.
#
# The plain benign families are trimmed rather than the hard negatives: a hard
# negative is the evidence that a term does not fire on legitimate traffic, and
# there is no spare capacity there.
matrix_version = "2.0"
dataset_version = "dataset-generalization-test-v2"
snapshot_interval_seconds = 2.0
max_samples_per_source = 40
max_samples_per_scenario = 960


