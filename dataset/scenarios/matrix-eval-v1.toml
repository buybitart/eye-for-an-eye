# dataset-eval-v1 scenario matrix: matrix-v1 with more independent seeded
# sources per scenario, generated for the P15.1 final-decision evaluation.
#
# Nothing about the behaviours changed. Only `runs` was scaled -- benign x7,
# malicious x2 -- so the false-block rate is measured over enough distinct
# benign sources to mean anything. 602 benign and 144 malicious source groups.
#
# A larger sample of the same matrix is a narrower claim than it looks: it
# estimates the rate over *these behaviours*, not over the Internet. Scenario
# diversity is unchanged at 35 definitions, so this buys statistical power and
# buys no coverage at all.

matrix_version = "1.0"
dataset_version = "dataset-eval-v1"
snapshot_interval_seconds = 2.0
max_samples_per_source = 40
max_samples_per_scenario = 480

[[scenario]]
id = "benign/web/browse"
group = "benign-web"
generator = "benign.web_client"
runs = 56
params = { requests = 16, period = 1.1, follow_ups = 2 }

