# dataset-v1.0 scenario matrix.
#
# A deliberate representative matrix, not a combinatorial sweep. Every scenario is local,
# bounded and offline. `runs` is the number of independent seeded sources for that variant;
# each run becomes one source_group, and all its windows stay in one split.
#
# Ports and sensor addresses are shared across both label classes on purpose: a port or an
# address must never be able to stand in for the label.

matrix_version = "1.0"
dataset_version = "dataset-v1.0"
snapshot_interval_seconds = 2.0
max_samples_per_source = 40
max_samples_per_scenario = 60

# --- ordinary benign ---------------------------------------------------------
[[scenario]]
id = "benign/web/browse"
group = "benign-web"
generator = "benign.web_client"
runs = 8
params = { requests = 16, period = 1.1, follow_ups = 2 }

[[scenario]]
id = "benign/web/browse-slow"
group = "benign-web"
generator = "benign.web_client"
runs = 5
params = { requests = 12, period = 3.4, follow_ups = 1 }

[[scenario]]
id = "benign/web/page-burst"
group = "benign-web-burst"
generator = "benign.web_burst"
runs = 8
params = { bursts = 5, burst_size = 9 }

[[scenario]]
id = "benign/ssh/short-session"
group = "benign-ssh"
generator = "benign.ssh_session"
runs = 8
params = { sessions = 7, period = 8.0 }

[[scenario]]
id = "benign/retry/flaky-link"
group = "benign-retry"
generator = "benign.retry_then_success"
runs = 5
params = { attempts = 16, period = 1.8 }

[[scenario]]
id = "benign/noise/ambient"
group = "benign-noise"
generator = "benign.ambient_noise"
runs = 5
params = { contacts_count = 12, period = 5.5 }

[[scenario]]
id = "benign/web/api-client"
group = "benign-api"
generator = "benign.web_client"
runs = 5
params = { requests = 20, period = 0.9, follow_ups = 3, ports = [443, 8443, 9090] }

