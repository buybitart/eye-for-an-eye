# Truncated captures. A sensor that loses payload visibility produces missing payload
# features rather than observed zeros. Both label classes have one, so the availability
# masks cannot become a label shortcut.
[[scenario]]
id = "benign/web/truncated-capture"
group = "benign-truncated"
generator = "benign.web_client"
runs = 4
snaplen = 44
params = { requests = 16, period = 1.3, follow_ups = 2 }

[[scenario]]
id = "probe/repeated-truncated-capture"
group = "probe-truncated"
generator = "protocol.repeated_probes"
runs = 4
snaplen = 44
params = { attempts = 45, period = 0.9 }

# Connect-only behaviour. The sensor observes a connection and no payload, so payload
# features are missing rather than zero. One scenario per label class.
[[scenario]]
id = "hard-negative/health-check/connect-probe"
group = "hard-negative-connect"
generator = "benign.connect_probe"
runs = 5
params = { checks = 45, period = 2.0, port_count = 3 }

[[scenario]]
id = "scan/connect-only"
group = "scan-connect"
generator = "scanner.connect_scan"
runs = 5
params = { port_count = 40, period = 0.6, order = "sequential" }

[[scenario]]
id = "deception/decoy-enumeration"
group = "deception-enumeration"
generator = "deception.decoy_enumeration"
runs = 4
params = { sessions = 10, commands = 5, period = 2.5 }

# Benign traffic reaches decoys too. Without this the decoy counter would be a label shortcut.
[[scenario]]
id = "hard-negative/deception/brush-past"
group = "hard-negative-deception"
generator = "deception.decoy_brush_past"
runs = 5
params = { touches = 5, period = 18.0 }

