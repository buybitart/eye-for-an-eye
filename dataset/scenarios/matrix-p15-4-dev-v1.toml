# --- admin ------------------------------------------------------------------
# One site, the highest false-block cost in the policy (cutoff 0.888889), and
# the traffic most easily mistaken for an attack: an administrator diagnosing a
# problem looks like reconnaissance, and one who has forgotten a password looks
# like a brute force.

[[scenario]]
id = "hard-negative/admin/login-mistakes"
group = "profile-admin-mistakes"
generator = "profiles.admin_login_mistakes"
runs = 26
params = { mistakes = 3, period = 6.5 }
