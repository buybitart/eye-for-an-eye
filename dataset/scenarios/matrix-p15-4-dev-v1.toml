# --- payment_webhook --------------------------------------------------------
# The profile that never blocks by design: its cutoff of 0.998004 is above
# anything the scoring path produces. That is a claim worth measuring rather
# than assuming, which is why the site is here at all, and why it carries a
# positive as well as the signed callbacks.

[[scenario]]
id = "hard-negative/webhook/signed-callback"
group = "profile-webhook-signed"
generator = "profiles.signed_webhook"
runs = 22
params = { callbacks = 50, period = 4.0 }
site_group = "site-hook-1"
profile_type = "payment_webhook"

[[scenario]]
id = "benign/webhook/retry"
group = "benign-retry"
generator = "benign.retry_then_success"
runs = 14
params = { attempts = 12, period = 4.0 }
site_group = "site-hook-1"
profile_type = "payment_webhook"

[[scenario]]
id = "probe/webhook/repeated"
group = "probe-repeated"
generator = "protocol.repeated_probes"
runs = 8
params = { attempts = 45, period = 0.9, ports = [443, 8443] }
site_group = "site-hook-1"
profile_type = "payment_webhook"


# --- honeypot ---------------------------------------------------------------
# The only profile where a false block is cheap (cutoff 0.666667), because
# nothing legitimate has a reason to be here. The benign family is the one thing
# that does: something brushing past a decoy by accident.

[[scenario]]
id = "hard-negative/deception/brush-past"
group = "hard-negative-deception"
generator = "deception.decoy_brush_past"
runs = 20
params = { touches = 5, period = 18.0 }
site_group = "site-decoy-1"
profile_type = "honeypot"

[[scenario]]
id = "deception/decoy-enumeration"
group = "deception-enumeration"
generator = "deception.decoy_enumeration"
runs = 10
params = { sessions = 10, commands = 5, period = 2.5 }
site_group = "site-decoy-1"
profile_type = "honeypot"

[[scenario]]
id = "composite/decoy-then-enumerate"
group = "composite-decoy-recon"
generator = "composite.decoy_then_enumerate"
runs = 10
site_group = "site-decoy-1"
profile_type = "honeypot"

[[scenario]]
id = "probe/service-enumeration"
group = "probe-enumeration"
generator = "scanner.service_enumeration"
runs = 6
params = { rounds = 4, period = 0.7 }
site_group = "site-decoy-1"
profile_type = "honeypot"

[[scenario]]
id = "scan/burst/pause"
group = "scan-burst"
generator = "scanner.burst_scan"
runs = 8
params = { bursts = 4, burst_size = 10, inside = 0.6, pause = 30.0 }
site_group = "site-decoy-1"
profile_type = "honeypot"
