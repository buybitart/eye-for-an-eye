# dataset-p15-4-dev-v1: the P15.4 development corpus.
#
# Two things are new here, and the first is the reason the second was possible.
#
# EVERY SCENARIO DECLARES A SITE. P15.1, P15.2 and P15.3 each reported that
# per-profile metrics could not be produced, because `site_group` was `None` on
# every row of every corpus. That is not a cosmetic gap: a false-block rate
# averaged over a whole benchmark hides the profile where the system is worst,
# and "the worst site" is exactly the number an average is supposed to be read
# against. Nine sites across the five cost profiles are declared below, and every
# one of them carries both benign and malicious traffic -- a site that only ever
# sees attacks would make its false-block rate undefined and its detection rate
# flattering, which is the same mistake in a different column.
#
# Neither `site_group` nor `profile_type` is a feature. Both are listed in
# `dataset.schema.NEVER_MODEL_INPUT`, neither has a feature column, and
# `tests/test_p15_4_profiles.py` checks that from four directions. Site identity
# is a superb predictor of the label in a synthetic corpus, so a model that could
# see it would score beautifully having learned nothing about behaviour at all.
#
# AUTHENTICATION HAS AN OUTCOME. Twelve families from `generators/profiles.py`
# appear here, arranged as pairs: for each profile, a benign family and a
# malicious family that present the same surface evidence and differ only in what
# the server answered. An authenticated batch client against a credential spray;
# a service account whose token expires against a patient account walk; an
# administrator mistyping a password against a brute force. Until P15.4 no
# scenario could express `530 Login incorrect`, so the corpus could only exercise
# credential *presence* -- the quantity P15.3 proved says nothing, and the one
# that blocked 21 of 22 sources of a legitimate batch client.
#
# `hard-negative/api/stale-credential` was added after the first build, because
# the authentication ablation could not see the failure-span term doing anything:
# it was the sole strongest signal in 1 of 1027 windows, on a corpus that
# happened to contain no behaviour it applied to. A term that quiet is either
# useless or dangerous and no measurement could say which. Adding the behaviour
# -- a job retrying an old password every twenty-six seconds for ten minutes --
# answered it immediately: the term scored that entirely benign source 0.784,
# higher than any other benign source in the corpus and higher than several real
# attacks. The gap was in the corpus, and the defect it hid was in the formula.
#
# WHAT IS NOT HERE. The two `withheld.*` families. They are scored once, on the
# locked benchmark, and `tests/test_p15_4_withheld.py` fails if either appears in
# this file.
#
# WHAT IS HERE THAT USED TO BE WITHHELD. The six `composite.*` families P15.3
# withheld are in this corpus, and that is a deliberate, stated cost. They were
# scored and reported in the P15.3 final report, so they have been looked at;
# calling them unseen a second time would be the kind of bookkeeping that makes
# a generalisation claim worthless. They are good hard negatives and they stay,
# as development data. The generalisation claim for P15.4 rests on the two new
# withheld families and on nothing else.
#
# 528 benign and 228 malicious source groups, 756 in total. The benign side is
# large for one reason: the release gate measures a false-block rate per source
# and needs at least 500 distinct benign sources before that rate means anything
# at all. A larger sample of the same behaviours buys statistical power and no
# coverage -- scenario diversity, not run count, is what would buy coverage.

matrix_version = "1.0"
dataset_version = "dataset-p15-4-dev-v1"
snapshot_interval_seconds = 2.0
max_samples_per_source = 40
max_samples_per_scenario = 1600


# --- public_website ---------------------------------------------------------
# Three sites. The profile whose cutoff is 0.975610 and whose traffic is the
# most varied: browsers, crawlers, and whatever the Internet sends at a web
# server unprompted.

[[scenario]]
id = "benign/web/browse"
group = "benign-web"
generator = "benign.web_client"
runs = 26
params = { requests = 16, period = 1.1, follow_ups = 2 }
site_group = "site-web-1"
profile_type = "public_website"

[[scenario]]
id = "benign/web/browse-slow"
group = "benign-web"
generator = "benign.web_client"
runs = 16
params = { requests = 12, period = 3.4, follow_ups = 1 }
site_group = "site-web-2"
profile_type = "public_website"

[[scenario]]
id = "benign/web/page-burst"
group = "benign-web-burst"
generator = "benign.web_burst"
runs = 20
params = { bursts = 5, burst_size = 9 }
site_group = "site-web-1"
profile_type = "public_website"

[[scenario]]
id = "hard-negative/web/asset-fetch"
group = "profile-web-assets"
generator = "profiles.asset_fetch"
runs = 22
params = { pages = 4, assets = 22 }
site_group = "site-web-2"
profile_type = "public_website"

[[scenario]]
id = "hard-negative/content-crawler"
group = "hard-negative-crawler"
generator = "composite.content_crawler"
runs = 20
site_group = "site-web-3"
