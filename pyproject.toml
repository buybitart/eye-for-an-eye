[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-for-an-eye"
version = "0.8.0rc1"
description = "Bounded defensive network observation and finite deception profiles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aliaksandr Zasinets" }]
maintainers = [{ name = "Aliaksandr Zasinets" }]
keywords = ["defensive-deception", "honeypot", "network-observation"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3.12", "Topic :: Security"]

[project.optional-dependencies]
capture = ["scapy>=2.7,<2.8"]
enrichment = ["maxminddb>=3.1,<4", "ipwhois>=1.3,<2"]
test = ["pytest>=8,<10"]
lint = ["ruff"]
ml = ["onnxruntime==1.29.0", "onnx==1.22.0", "numpy==2.5.3"]
ml-training = ["scikit-learn==1.9.1", "skl2onnx==1.20.0", "onnx==1.22.0", "numpy==2.5.3", "psutil==7.2.2"]
quality = ["mypy>=1.19,<2", "pip-audit>=2.10,<3", "bandit>=1.8,<2", "build>=1.3,<2",
           "cyclonedx-python-lib[json-validation]>=11,<12"]

[project.scripts]
eye-for-an-eye = "eye_for_an_eye.cli:main"

[tool.setuptools.packages.find]
include = ["eye_for_an_eye*"]

[tool.setuptools.package-data]
eye_for_an_eye = ["templates/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["linux_lab: requires a separately authorized isolated Linux lab"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["eye_for_an_eye.operator_cli", "eye_for_an_eye.configuration", "eye_for_an_eye.demo", "eye_for_an_eye.storage.lifecycle"]
check_untyped_defs = true

[tool.uv]
# Keep P0-tested providers while introducing runtime architecture; upgrade separately.
constraint-dependencies = ["scapy==2.7.0", "maxminddb==3.1.1", "ipwhois==1.3.0"]
