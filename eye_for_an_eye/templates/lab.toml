# DO NOT USE ON PUBLIC INTERNET. Finite loopback conversation, no active probes.
config_version = 1
[deployment]
profile = "lab"
egress = "disabled"
[network]
bind_address = "127.0.0.1"
port = 1234
udp_responses = false
[deception]
enabled = true
secret_file = ""
mode = "lab"
port_set = "custom"
decoy_ports = [1234]
port_profiles = {"1234" = "ftp"}
source_allowlist = ["127.0.0.1/32"]
[lab]
max_duration = 10.0
[active_probes]
enabled = false
[enrichment]
enabled = false
rdap_enabled = false
[runtime]
status_file = "status.json"
[storage]
enabled = true
path = "events.sqlite3"
retention_seconds = 3600.0
max_events = 10000
max_bytes = 16777216
[api]
enabled = true
bind_address = "127.0.0.1"
port = 8777
[metrics]
enabled = true
bind_address = "127.0.0.1"
port = 8778
[firewall]
enabled = false

# P7: local decisions; no model download or firewall changes by default.
[ml]
enabled = true
required = false
model_path = ""
manifest_path = ""
max_pending = 64
max_concurrent = 1
inference_timeout_ms = 200

[decision]
enabled = true
mode = "shadow"
interval_ms = 2000

[enforcement]
enabled = false
management_networks = []
allowlist = []
trusted_proxies = []
